name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and mocked integration tests
        run: npm test

      - name: Typecheck backend
        run: npm run typecheck

      - name: Typecheck dashboard
        run: npm run typecheck:dashboard

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build backend
        run: npm run build

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Upload sanitized build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: trading-bot-build-${{ github.sha }}
          path: |
            dist/
            dist-dashboard/
          if-no-files-found: error
          retention-days: 7
